<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}" />


    <title>Offer</title>
</head>


<body>
    <nav th:replace="~{navbar :: navbar('Pizze')}"></nav>

    <div class="container">
        <div class="content">

            
            <h1 class="text-center py-3" th:text="|Offer ${offer.pizza.name}|"></h1>
            <hr />
            <form id="offer-form" th:object="${offer}" th:action="${editMode} ? @{/offers/edit/{id}(id=${offer.id})} : @{/offers/create}" 
                method="post">
                <input type="hidden" th:field="*{pizza}" id="pizza">
                <div class="w-50 gy-2">
                    <div class="col-12">
                        <label class="form-label" for="title">Offer Title</label>
                        <input id="offerTitle" type="text"          class="form-control" th:field="*{title}"
                            th:errorClass="is-invalid">
                        <div th:if="${#fields.hasErrors('title')}"  class="invalid-feedback">
                            <ul>
                                <li th:each="err : ${#fields.errors('title')}" th:text="${err}"></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="startDate">Start Date</label>
                        <input id="startDate" type="date" class="form-control" th:field="*{startDate}"
                            th:errorClass="is-invalid">
                        <div th:if="${#fields.hasErrors('startDate')}" class="invalid-feedback">
                            <ul>
                                <li th:each="err : ${#fields.errors('startDate')}" th:text="${err}"></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="endDate">End Date</label>
                        <input id="endDate" type="date" class="form-control" th:field="*{endDate}" th:errorClass="is-invalid">
                        <div th:if="${#fields.hasErrors('endDate')}" class="invalid-feedback">
                            <ul>
                                <li th:each="err : ${#fields.errors('endDate')}" th:text="${err}"></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Salvataggio -->
                    <div class="col-12 pt-4">
                        <button class="btn btn-success" type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-floppy" viewBox="0 0 16 16">
                            <path d="M11 2H9v3h2z"/>
                            <path d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
                            </svg>
                            Save 
                        </button>

                        <a th:href="@{/pizze/show/{id}(id=${offer.pizza.id})}" class="btn btn-danger">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-square" viewBox="0 0 16 16">
                            <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                            </svg>
                            
                            Cancel</a>
                    </div>
                </div>
            </form>

        </div>
    </div>


    <!-- Bootstrap Bundle with Popper -->
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
